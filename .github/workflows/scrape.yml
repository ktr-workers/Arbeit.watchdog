name: scrape

on:
  schedule:
    - cron: "0 8,17 * * *"  # 09:00 and 18:00 Berlin in winter (CET), 10:00 and 19:00 in summer
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python -m watchdog.main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY: ${{ github.repository_owner }}
      - name: Commit data/jobs.db and jobs.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/jobs.db web/public/jobs.json
          git diff --cached --quiet || { git commit -m "Update jobs.db" && git pull --rebase && git push; }
